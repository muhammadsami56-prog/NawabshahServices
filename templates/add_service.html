<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post a New Service - Nawabshah Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .navbar {
            background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%);
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .btn-custom {
            background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%);
            border: none;
            color: white;
        }
        .btn-custom:hover {
            opacity: 0.9;
            color: white;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fas fa-tools me-2"></i>Nawabshah Services</a>
            <a href="/dashboard" class="btn btn-outline-light btn-sm rounded-pill px-3">Dashboard</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-5 bg-white">
                    <h2 class="fw-bold text-dark mb-4 text-center"><i class="fas fa-plus-circle text-primary me-2"></i>Post a New Service</h2>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Service Title</label>
                            <input type="text" name="title" class="form-control rounded-pill px-3" placeholder="e.g., Expert Electrician" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category</label>
                            <input type="text" name="category" class="form-control rounded-pill px-3" placeholder="e.g., Electrician, Plumber" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea name="description" class="form-control rounded-4 px-3 py-2" rows="4" placeholder="Describe your service..." required></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Price (PKR)</label>
                            <input type="number" step="0.01" name="price" class="form-control rounded-pill px-3" placeholder="e.g., 1500" required>
                        </div>
                        <button type="submit" class="btn btn-custom w-100 py-2 rounded-pill fw-bold shadow-sm">Add Service</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="/dashboard" class="text-secondary text-decoration-none small"><i class="fas fa-arrow-left me-1"></i>Back to Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
